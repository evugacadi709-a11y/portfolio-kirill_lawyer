<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Inter:wght@400;500;600;700&display=swap&subset=cyrillic">
<style>
  :root{
    --bg:#ffffff;
    --surface:#ffffff;
    --surface-2:#f7f7f5;
    --ink:#161616;
    --ink-soft:#68696c;
    --line:#e3e2df;
    --accent:#161616;
    --on-accent:#ffffff;
    --gold:#93712e;
    --gold-soft:#b8935a;
    --shadow: none;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#111111;
      --surface:#161616;
      --surface-2:#1c1c1c;
      --ink:#f2f2f0;
      --ink-soft:#a6a6a3;
      --line:#2c2c2a;
      --accent:#f2f2f0;
      --on-accent:#111111;
      --gold:#cdae6c;
      --gold-soft:#e3c98d;
    }
  }
  :root[data-theme="dark"]{
    --bg:#111111;
    --surface:#161616;
    --surface-2:#1c1c1c;
    --ink:#f2f2f0;
    --ink-soft:#a6a6a3;
    --line:#2c2c2a;
    --accent:#f2f2f0;
    --on-accent:#111111;
    --gold:#cdae6c;
    --gold-soft:#e3c98d;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Inter",-apple-system,"Segoe UI",sans-serif;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{
    font-family:"PT Serif","Georgia",serif;
    font-weight:400;
    letter-spacing:-.01em;
    text-wrap:balance;
    color:var(--ink);
  }
  a{color:inherit;}
  .wrap{max-width:1160px;margin:0 auto;padding-inline:32px;}
  section{padding-block:104px;}
  .eyebrow{
    text-transform:uppercase;
    letter-spacing:.22em;
    font-size:11.5px;
    color:var(--gold);
    font-weight:600;
    margin-bottom:18px;
  }
  .rule{width:40px;height:1px;background:var(--gold);margin-bottom:26px;}
  .lede{color:var(--ink-soft);font-size:16.5px;max-width:62ch;font-weight:400;}

  /* header */
  header.site{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
    background:color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  header.site .bar{display:flex;align-items:center;justify-content:space-between;padding-block:22px;}
  .logo{font-family:"PT Serif",serif;font-weight:700;font-size:18px;display:flex;flex-direction:column;line-height:1.2;letter-spacing:.01em;}
  .logo span{font-family:"Inter",sans-serif;font-weight:500;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-top:3px;}
  nav.links{display:flex;gap:34px;font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;}
  nav.links a{text-decoration:none;color:var(--ink-soft);transition:color .15s;}
  nav.links a:hover{color:var(--ink);}
